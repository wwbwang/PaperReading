<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="跟踪关注作者在本地论文库中的公开成果，核对作者身份并管理阅读状态。">
  <title>作者跟踪 · PaperReading</title>
  <link rel="stylesheet" href="/library.css">
  <link rel="stylesheet" href="/author-assets/katex.css">
  <script type="module" src="/authors.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="/"><span class="brand-icon" aria-hidden="true">P<span>r</span></span>PaperReading</a><nav aria-label="主导航"><a href="/">论文库</a><a href="/authors/" aria-current="page">作者跟踪</a></nav></header>
  <main>
    <header class="library-intro"><h1>作者跟踪</h1></header>
    <p id="load-status" role="status">正在读取本地作者索引…</p>
    <div id="author-content" class="author-workspace" hidden>
      <nav class="author-directory" aria-labelledby="author-directory-title">
        <div class="directory-heading"><h2 id="author-directory-title">作者名单</h2><span>拖动调整顺序</span></div>
        <ul id="author-list"></ul>
        <p id="storage-status" class="state-message" role="status"></p>
      </nav>
      <div class="author-main" hidden>
      <section class="author-profile" aria-label="作者档案"><div class="profile-top"><div id="author-avatar" class="avatar" aria-hidden="true"></div><div><h2><span id="author-name"></span><span id="author-name-en" class="name-en"></span></h2><p id="author-affiliation"></p></div><div class="profile-actions"><button id="follow-author" type="button" aria-pressed="true">已关注</button></div></div><div id="author-topics" class="topic-tags"></div><div id="author-links" class="profile-links"></div></section>
      <form id="author-filters" class="author-filters" role="search" aria-label="筛选作者论文"><label>搜索论文<input type="search" id="author-query" placeholder="在当前作者的论文标题中查找…"></label><label>年份<select id="author-year"><option value="all">全部年份</option><option>2027</option><option>2026</option><option>2025</option></select></label><label>会议 / 期刊<select id="author-venue"><option value="all">全部来源</option></select></label><label>身份核实<select id="identity-filter"><option value="verified">已核实</option><option value="candidate">同名待核实</option><option value="all">全部记录</option></select></label><label class="check-label"><input type="checkbox" id="unread-only">仅看未读</label></form>
      <div class="results-heading"><p id="paper-count" role="status"></p><button id="mark-visible-read" type="button">将筛选结果标为已读</button></div>
      <div id="author-papers"></div><button id="load-more" class="load-more" type="button" hidden>显示更多</button>
      <p class="small-note">已读和关注状态保存在当前浏览器，不跨设备同步。论文库重建时重新关联作者记录；不会自动抓取匿名作者信息或发送通知。</p>
      </div>
    </div>
    <footer><span>PaperReading · 作者跟踪</span><p>档案与核实证据保存在本地仓库。<br>来源未公开作者或尚未收录的论文，不会出现在跟踪结果中。</p></footer>
  </main>
</body>
</html>
